components:
  schemas:
    LoginRequestSchema:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponseSchema:
      type: object
      required: [ token, role ]
      properties:
        token:
          type: string
        role:
          type: string
          enum: [ ADMIN, COORDINATOR, COACH, VISITOR ]
    # --- SEASONS ---
    SeasonRequest:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
          example: "2025/2026"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
          default: false

    SeasonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean

    # --- CATEGORIES ---
    CategoryRequest:
      type: object
      required: [name, gender]
      properties:
        name:
          type: string
          example: "Cadete A"
        gender:
          type: string
          enum: [MALE, FEMALE, MIXED]
        minAge:
          type: integer
          example: 14
        maxAge:
          type: integer
          example: 16

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        gender:
          type: string
        minAge:
          type: integer
        maxAge:
          type: integer

    # --- TEAMS ---
    TeamRequest:
      type: object
      required: [categoryId, seasonId, name]
      properties:
        categoryId:
          type: string
          format: uuid
        seasonId:
          type: string
          format: uuid
        name:
          type: string
          example: "CD Oropesa Cadete A"
        groupName:
          type: string
          example: "Grupo 1 Provincial"

    TeamResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        groupName:
          type: string
        category:
          $ref: '#/components/schemas/CategoryResponse'
        season:
          $ref: '#/components/schemas/SeasonResponse'

    TeamPlayerCreateRequest:
      type: object
      required: [playerId]
      properties:
        playerId:
          type: string
          format: uuid
        dorsal:
          type: integer
          minimum: 0
          maximum: 99
        status:
          type: string
          enum: [PENDING_DOCS, ACTIVE, INACTIVE, EXPIRED_LICENSE]
          default: PENDING_DOCS
        positions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]

    TeamPlayerUpdateRequest:
      type: object
      properties:
        dorsal:
          type: integer
          minimum: 0
          maximum: 99
        clearDorsal:
          type: boolean
          default: false
        status:
          type: string
          enum: [PENDING_DOCS, ACTIVE, INACTIVE, EXPIRED_LICENSE]
        positions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]

    TeamPlayerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dorsal:
          type: integer
        status:
          type: string
          enum: [PENDING_DOCS, ACTIVE, INACTIVE, EXPIRED_LICENSE]
        positions:
          type: array
          items:
            type: string
            enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]

    TeamStaffCreateRequest:
      type: object
      required: [coachId, roleInTeam]
      properties:
        coachId:
          type: string
          format: uuid
        roleInTeam:
          type: string
          enum: [HEAD_COACH, SECOND_COACH, THIRD_COACH, ASSISTANT_COACH, DELEGATE, GOALKEEPER_COACH, FITNESS_COACH, PHYSIOTHERAPIST, KIT_MANAGER]

    TeamStaffResponse:
      type: object
      required: [id, coachId, firstName, lastName, roleInTeam]
      properties:
        id:
          type: string
          format: uuid
        coachId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        roleInTeam:
          type: string
          enum: [HEAD_COACH, SECOND_COACH, THIRD_COACH, ASSISTANT_COACH, DELEGATE, GOALKEEPER_COACH, FITNESS_COACH, PHYSIOTHERAPIST, KIT_MANAGER]

    # --- PLAYERS ---
    PlayerRequest:
      type: object
      required: [firstName, lastName, birthDate]
      properties:
        firstName:
          type: string
          example: "Alejandro"
        lastName:
          type: string
          example: "García"
        birthDate:
          type: string
          format: date
        dni:
          type: string
          example: "12345678X"
        licenseNumber:
          type: string
          example: "LIC-98765"
        address:
          type: string
          example: "Calle Mayor 12"
        photoUrl:
          type: string
        gdprConsent:
          type: boolean
          default: false
        guardianName:
          type: string
        guardianPhone:
          type: string
        guardianEmail:
          type: string

    PlayerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        dni:
          type: string
        licenseNumber:
          type: string
        address:
          type: string
        photoUrl:
          type: string
          description: Ruta interna del archivo privado de fotografía, si existe
        documentation:
          type: array
          description: Metadatos de documentos privados; el contenido está en Storage
          items:
            $ref: '#/components/schemas/PlayerDocumentResponse'
        gdprConsent:
          type: boolean
        guardianName:
          type: string
        guardianPhone:
          type: string
        guardianEmail:
          type: string

    PlayerFileAccessResponse:
      type: object
      required: [url, expiresInSeconds]
      properties:
        url:
          type: string
          format: uri
        expiresInSeconds:
          type: integer
          example: 300

    PlayerDocumentResponse:
      type: object
      required: [id, fileName, kind, contentType]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        kind:
          type: string
          enum: [DNI_FRONT, DNI_BACK, OTHER]
        contentType:
          type: string

    # --- COACHES ---
    CoachRequest:
      type: object
      required: [firstName, lastName, dni, phone, email]
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dni:
          type: string
        phone:
          type: string
        address:
          type: string
        email:
          type: string
        licenseNumber:
          type: string
        qualification:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    CoachResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dni:
          type: string
        phone:
          type: string
        address:
          type: string
        email:
          type: string
        qualification:
          type: string
        photoUrl:
          type: string
          description: Ruta interna de la fotografía privada
        documentation:
          type: array
          description: Metadatos de documentos privados
          items:
            $ref: '#/components/schemas/PlayerDocumentResponse'
        status:
          type: string

    # --- VENUES ---
    VenueRequest:
      type: object
      required: [name, city]
      properties:
        name:
          type: string
          example: "Campo Municipal de Oropesa"
        address:
          type: string
        city:
          type: string
          example: "Oropesa"
        isHomeVenue:
          type: boolean
          default: false
        surfaceType:
          type: string
          example: "Césped Artificial"
        googleMapsUrl:
          type: string
        imageUrl:
          type: string
        notes:
          type: string

    VenueResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        city:
          type: string
        isHomeVenue:
          type: boolean
        surfaceType:
          type: string
        googleMapsUrl:
          type: string
        imageUrl:
          type: string
        notes:
          type: string

    OpponentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 150
          example: "C.F. Talavera Benjamín A"
        contactPerson:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        notes:
          type: string

    OpponentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contactPerson:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        notes:
          type: string

    # --- MATCHES ---
    MatchRequest:
      type: object
      required: [teamId, opponentId, venueId, matchday, matchDate]
      properties:
        teamId:
          type: string
          format: uuid
        opponentId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        matchday:
          type: integer
        matchDate:
          type: string
          format: date
        matchTime:
          type: string
          example: "17:00:00"
        homeScore:
          type: integer
        awayScore:
          type: integer
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, SUSPENDED, POSTPONED]

    MatchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        opponentId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        matchday:
          type: integer
        matchDate:
          type: string
          format: date
        matchTime:
          type: string
        homeScore:
          type: integer
        awayScore:
          type: integer
        status:
          type: string

    # --- STANDINGS ---
    StandingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        opponentName:
          type: string
        played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goalsFor:
          type: integer
        goalsAgainst:
          type: integer
        points:
          type: integer
        position:
          type: integer