openapi: 3.0.3
info:
  title: CD Oropesa API
  description: API oficial para la gestión integral del CD Oropesa (Monolito Modular con Spring Boot y PostgreSQL).
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de Desarrollo Local

tags:
  - name: Authentication
    description: Inicio de sesión
  - name: Seasons
    description: Gestión de Temporadas del club
  - name: Categories
    description: Categorías base de competición
  - name: Teams
    description: Equipos federados por temporada
  - name: TeamPlayers
    description: Inscripciones de jugadores en equipos
  - name: Players
    description: Maestro de Jugadores y fichas
  - name: Coaches
    description: Maestro de Entrenadores y técnicos
  - name: Venues
    description: Instalaciones deportivas y campos
  - name: Opponents
    description: Clubes y equipos rivales
  - name: Matches
    description: Calendario y resultados de partidos
  - name: Standings
    description: Tablas de clasificación

paths:
  /auth/login:
    post:
      tags: [ Authentication ]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestSchema'
      responses:
        '200':
          description: Inicio de sesión correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseSchema'
        '401':
          description: Credenciales incorrectas
  /auth/session:
    get:
      tags: [ Authentication ]
      summary: Validar la sesión actual
      operationId: validateSession
      description: Requiere un token JWT válido en el encabezado Authorization.
      responses:
        '204':
          description: La sesión es válida
        '401':
          description: Token ausente, inválido o caducado
  # ==========================================
  # SEASONS
  # ==========================================
  /seasons:
    get:
      tags: [Seasons]
      summary: Listar todas las temporadas
      operationId: getAllSeasons
      responses:
        '200':
          description: Lista de temporadas obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeasonResponse'
    post:
      tags: [Seasons]
      summary: Crear una nueva temporada
      operationId: createSeason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonRequest'
      responses:
        '201':
          description: Temporada creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'

  /seasons/{id}:
    get:
      tags: [Seasons]
      summary: Obtener una temporada por ID
      operationId: getSeasonById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Temporada encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '404':
          description: Temporada no encontrada
    put:
      tags: [Seasons]
      summary: Actualizar una temporada
      operationId: updateSeason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonRequest'
      responses:
        '200':
          description: Temporada actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '404':
          description: Temporada no encontrada
    delete:
      tags: [Seasons]
      summary: Eliminar una temporada
      operationId: deleteSeason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Temporada eliminada con éxito

  # ==========================================
  # CATEGORIES
  # ==========================================
  /categories:
    get:
      tags: [Categories]
      summary: Listar todas las categorías
      operationId: getAllCategories
      responses:
        '200':
          description: Lista obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Crear una categoría
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
  /categories/{id}:
    get:
      tags: [Categories]
      summary: Obtener una categoría por ID
      operationId: getCategoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Categoría no encontrada
    put:
      tags: [Categories]
      summary: Actualizar una categoría
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Categoría no encontrada
    delete:
      tags: [Categories]
      summary: Eliminar una categoría
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Categoría eliminada con éxito
        '404':
          description: Categoría no encontrada

  # ==========================================
  # TEAMS
  # ==========================================
  /teams:
    get:
      tags: [Teams]
      summary: Listar todos los equipos
      operationId: getAllTeams
      responses:
        '200':
          description: Lista obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'
    post:
      tags: [Teams]
      summary: Crear un equipo
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: Creado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          description: La categoría o temporada indicada no existe
  /teams/{id}:
    get:
      tags: [Teams]
      summary: Obtener un equipo por ID
      operationId: getTeamById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Equipo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '404':
          description: Equipo no encontrado
    put:
      tags: [Teams]
      summary: Actualizar un equipo
      operationId: updateTeam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '200':
          description: Equipo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '404':
          description: Equipo no encontrado
        '400':
          description: La categoría o temporada indicada no existe
    delete:
      tags: [Teams]
      summary: Eliminar un equipo
      operationId: deleteTeam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Equipo eliminado con éxito
        '404':
          description: Equipo no encontrado

  /teams/{teamId}/players:
    get:
      tags: [TeamPlayers]
      summary: Listar la plantilla de un equipo
      operationId: getTeamPlayers
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plantilla del equipo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamPlayerResponse'
        '404':
          description: Equipo no encontrado
    post:
      tags: [TeamPlayers]
      summary: Inscribir un jugador existente en un equipo
      operationId: addPlayerToTeam
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamPlayerCreateRequest'
      responses:
        '201':
          description: Jugador inscrito en el equipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPlayerResponse'
        '404':
          description: Equipo o jugador no encontrado
        '409':
          description: El jugador ya está inscrito en el equipo

  /teams/{teamId}/players/{teamPlayerId}:
    patch:
      tags: [TeamPlayers]
      summary: Actualizar dorsal y estado de una inscripción
      operationId: updateTeamPlayer
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamPlayerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamPlayerUpdateRequest'
      responses:
        '200':
          description: Inscripción actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPlayerResponse'
        '404':
          description: Inscripción no encontrada en ese equipo
    delete:
      tags: [TeamPlayers]
      summary: Quitar un jugador de la plantilla
      operationId: removePlayerFromTeam
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamPlayerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Inscripción eliminada; la ficha del jugador se conserva
        '404':
          description: Inscripción no encontrada en ese equipo

  /teams/{teamId}/staff:
    get:
      tags: [TeamStaff]
      summary: Listar cargos del cuerpo técnico asignados al equipo
      operationId: getTeamStaff
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asignaciones encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamStaffResponse'
        '404':
          description: Equipo no encontrado
    post:
      tags: [TeamStaff]
      summary: Asignar un cargo del cuerpo técnico al equipo
      operationId: addStaffToTeam
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamStaffCreateRequest'
      responses:
        '201':
          description: Cargo asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamStaffResponse'
        '404':
          description: Equipo o persona no encontrados
        '409':
          description: La misma persona ya tiene ese cargo en el equipo

  /teams/{teamId}/staff/{teamStaffId}:
    delete:
      tags: [TeamStaff]
      summary: Quitar un cargo del equipo
      operationId: removeStaffFromTeam
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamStaffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cargo quitado del equipo; la ficha de la persona se conserva
        '404':
          description: Asignación no encontrada en ese equipo

  # ==========================================
  # PLAYERS
  # ==========================================
  /players:
    get:
      tags: [Players]
      summary: Listar todos los jugadores del club
      operationId: getAllPlayers
      responses:
        '200':
          description: Lista obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerResponse'
    post:
      tags: [Players]
      summary: Registrar un nuevo jugador
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerRequest'
      responses:
        '201':
          description: Jugador registrado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'

  /players/{id}:
    get:
      tags: [Players]
      summary: Obtener detalle de un jugador por ID
      operationId: getPlayerById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Jugador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '404':
          description: No encontrado
    put:
      tags: [Players]
      summary: Actualizar datos de un jugador
      operationId: updatePlayer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerRequest'
      responses:
        '200':
          description: Actualizado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
    delete:
      tags: [Players]
      summary: Dar de baja/eliminar un jugador
      operationId: deletePlayer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Eliminado con éxito

  /players/{id}/photo:
    post:
      tags: [Players]
      summary: Subir o reemplazar la fotografía del jugador
      operationId: uploadPlayerPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Fotografía subida; se devuelve la ficha actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400':
          description: Formato o contenido no válido
        '404':
          description: Jugador no encontrado
        '413':
          description: Archivo superior al límite permitido
        '503':
          description: Almacenamiento no configurado
    delete:
      tags: [Players]
      summary: Eliminar la fotografía privada de un jugador
      operationId: deletePlayerPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fotografía eliminada y ficha actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '404':
          description: Jugador o fotografía no encontrada

  /players/{id}/photo-access:
    get:
      tags: [Players]
      summary: Obtener acceso temporal a la fotografía privada
      operationId: getPlayerPhotoAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enlace privado temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerFileAccessResponse'
        '404':
          description: Fotografía no encontrada

  /players/{id}/documentation:
    post:
      tags: [Players]
      summary: Subir documentación adicional o una cara del DNI
      operationId: uploadPlayerDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: [DNI_FRONT, DNI_BACK, OTHER]
      responses:
        '200':
          description: Archivo subido y ficha actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400':
          description: Tipo o archivo no válido
        '404':
          description: Jugador no encontrado
        '413':
          description: Archivo superior al límite permitido

  /players/{id}/documentation/{documentId}/access:
    get:
      tags: [Players]
      summary: Obtener un enlace temporal a documentación privada
      operationId: getPlayerDocumentAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enlace privado temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerFileAccessResponse'
        '404':
          description: Documento no encontrado

  /players/{id}/documentation/{documentId}:
    delete:
      tags: [Players]
      summary: Eliminar documentación privada
      operationId: deletePlayerDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archivo eliminado y ficha actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '404':
          description: Jugador o documento no encontrado

  # ==========================================
  # COACHES
  # ==========================================
  /coaches:
    get:
      tags: [Coaches]
      summary: Listar entrenadores
      operationId: getAllCoaches
      responses:
        '200':
          description: Lista obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoachResponse'
    post:
      tags: [Coaches]
      summary: Registrar un entrenador
      operationId: createCoach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachRequest'
      responses:
        '201':
          description: Creado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
        '400':
          description: El perfil de usuario indicado no existe
  /coaches/{id}:
    get:
      tags: [Coaches]
      summary: Obtener un entrenador por ID
      operationId: getCoachById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entrenador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
        '404':
          description: Entrenador no encontrado
    put:
      tags: [Coaches]
      summary: Actualizar un entrenador
      operationId: updateCoach
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachRequest'
      responses:
        '200':
          description: Entrenador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
        '404':
          description: Entrenador no encontrado
        '400':
          description: El perfil de usuario indicado no existe
    delete:
      tags: [Coaches]
      summary: Eliminar un entrenador
      operationId: deleteCoach
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Entrenador eliminado
        '404':
          description: Entrenador no encontrado
  /coaches/{id}/photo:
    post:
      tags: [Coaches]
      summary: Subir o reemplazar la fotografía del miembro del cuerpo técnico
      operationId: uploadCoachPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Fotografía subida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
    delete:
      tags: [Coaches]
      summary: Eliminar fotografía del miembro del cuerpo técnico
      operationId: deleteCoachPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fotografía eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
  /coaches/{id}/photo-access:
    get:
      tags: [Coaches]
      summary: Obtener enlace temporal a la fotografía del miembro del cuerpo técnico
      operationId: getCoachPhotoAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enlace privado temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerFileAccessResponse'
  /coaches/{id}/documentation:
    post:
      tags: [Coaches]
      summary: Subir documentación o una cara del DNI
      operationId: uploadCoachDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: [DNI_FRONT, DNI_BACK, OTHER]
      responses:
        '200':
          description: Archivo subido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
  /coaches/{id}/documentation/{documentId}/access:
    get:
      tags: [Coaches]
      summary: Obtener enlace temporal a documentación privada
      operationId: getCoachDocumentAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enlace privado temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerFileAccessResponse'
  /coaches/{id}/documentation/{documentId}:
    delete:
      tags: [Coaches]
