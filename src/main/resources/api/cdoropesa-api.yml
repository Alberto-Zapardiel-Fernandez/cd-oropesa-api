          type: string
          format: uuid
        name:
          type: string
        contactPerson:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        notes:
          type: string

    # --- MATCHES ---
    MatchRequest:
      type: object
      required: [teamId, opponentId, venueId, matchday, matchDate]
      properties:
        teamId:
          type: string
          format: uuid
        opponentId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        matchday:
